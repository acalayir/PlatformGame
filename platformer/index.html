<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0e2a2f" />
  <meta name="description" content="Zıpla Ada — short 2D platformer with 16 levels and 30 languages" />
  <title>Zıpla Ada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="hud">
      <span id="hud-level">Level 1</span>
      <span id="hud-lives">Lives ★★★</span>
      <span id="hud-coins">◆ 0</span>
    </div>

    <div id="top-actions">
      <button id="btn-lang" type="button" aria-label="Language" title="Language">🌐 EN</button>
      <button id="btn-mute" type="button" aria-label="Sound">Sound</button>
    </div>

    <div id="overlay" class="overlay">
      <div class="panel">
        <p class="brand">Zıpla Ada</p>
        <h1 id="overlay-title">Adventure begins</h1>
        <p id="overlay-msg">Short levels, big jumps. Reach the flag!</p>
        <button id="overlay-btn" type="button">Start</button>
        <button id="overlay-lang" type="button" class="linkish">🌐 Language</button>
      </div>
    </div>

    <div id="lang-panel" class="overlay hidden" aria-hidden="true">
      <div class="panel lang-panel">
        <p class="brand lang-brand">Zıpla Ada</p>
        <h1 id="lang-title">Language</h1>
        <div id="lang-list" class="lang-list" role="listbox"></div>
        <button id="lang-close" type="button" class="secondary">Close</button>
      </div>
    </div>

    <div id="touch" class="touch">
      <div class="touch-left">
        <button type="button" data-dir="left" aria-label="Left">◀</button>
        <button type="button" data-dir="right" aria-label="Right">▶</button>
      </div>
      <div class="touch-right">
        <button type="button" data-dir="jump" aria-label="Jump">▲</button>
      </div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="game.js"></script>
</body>
</html>
